<style>
  :root { --ink:#3d2b35; --pink:#e46c9b; }
  body { font-family:'Plus Jakarta Sans',sans-serif; background:#050505; color:var(--ink); margin:0; overflow-x:hidden; user-select:none; }
  .font-mono-code { font-family:'JetBrains Mono',monospace; }
  .glass-card { background:rgba(255,246,250,.84); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.85); box-shadow:0 25px 60px rgba(120,40,80,.28); }
  .glass-widget { background:rgba(255,246,250,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.8); box-shadow:0 10px 30px rgba(120,40,80,.2); }
  .glass-pill { background:rgba(255,255,255,.55); border:1px solid rgba(0,0,0,.08); }
  .icon-btn { background:rgba(255,255,255,.75); border:1px solid rgba(228,108,155,.25); color:var(--ink); transition:all .2s; }
  .icon-btn:hover { background:#fff; color:var(--pink); transform:scale(1.08); box-shadow:0 6px 16px rgba(228,108,155,.3); }
  .text-glow { text-shadow:0 0 10px rgba(255,255,255,.9); }
  @keyframes snakeSpin { to { transform:rotate(360deg); } }
  .animate-snake-spin { animation:snakeSpin 3.5s linear infinite; }
  .snake-glow-streak { background:conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 220deg, rgba(228,108,155,.1) 250deg, rgba(228,108,155,.3) 290deg, rgba(228,108,155,.65) 335deg, #e46c9b 360deg); }
  @keyframes blinkCursor { 0%,100%{opacity:1} 50%{opacity:0} }
  .animate-cursor-blink { animation:blinkCursor .9s infinite; }
  @keyframes eqBounce1 { 0%,100%{height:4px} 50%{height:14px} }
  @keyframes eqBounce2 { 0%,100%{height:12px} 50%{height:4px} }
  @keyframes eqBounce3 { 0%,100%{height:6px} 50%{height:13px} }
  @keyframes eqBounce4 { 0%,100%{height:10px} 50%{height:5px} }
  .eq-bar-1.active{animation:eqBounce1 .75s ease-in-out infinite}
  .eq-bar-2.active{animation:eqBounce2 .6s ease-in-out infinite .1s}
  .eq-bar-3.active{animation:eqBounce3 .85s ease-in-out infinite .2s}
  .eq-bar-4.active{animation:eqBounce4 .7s ease-in-out infinite .15s}
  @keyframes spinSlow { to { transform:rotate(360deg); } }
  .animate-spin-slow { animation:spinSlow 6s linear infinite; }
  input[type=range].prog { -webkit-appearance:none; appearance:none; height:4px; border-radius:99px; background:rgba(228,108,155,.25); cursor:pointer; }
  input[type=range].prog::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--pink); }
  input[type=range].prog::-moz-range-thumb { width:10px; height:10px; border:0; border-radius:50%; background:var(--pink); }
  .ctl { width:28px; height:28px; border-radius:99px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.8); border:1px solid rgba(228,108,155,.3); color:var(--ink); transition:all .15s; }
  .ctl:hover { background:#fff; color:var(--pink); } .ctl:active { transform:scale(.92); }
</style>

            <button class="ctl" onclick="nextTrack()" aria-label="Вперёд"><svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>

          <span id="dur-time">00:00</span>
        </div>

  <audio id="bg-audio" preload="metadata"></audio>

<script>
/* ===== Плейлист: добавляй треки сюда (файл рядом с index.html) ===== */
const tracks = [
  { title: 'do u love me?', src: 'song.mp3', cover: 'avatar.jpg' },
  // { title: 'название 2', src: 'song2.mp3', cover: 'avatar.jpg' },
];
const lanyardUserId = '1560303647303143500';

/* typewriter */
(function(){
  const el=document.getElementById('typewriter-text'); if(!el) return;
  const full="the path to the dream is not so difficult, just try."; let i=0,del=false; el.textContent="";
  function tick(){
    if(!del){ i++; el.textContent=full.slice(0,i); if(i>=full.length){ setTimeout(()=>{del=true;tick()},4000); return;} setTimeout(tick,45);}
    else { i--; el.textContent=full.slice(0,i); if(i<=0){ del=false; setTimeout(tick,800); return;} setTimeout(tick,20);}
  }
  setTimeout(tick,600);
})();

/* player */
const audio=document.getElementById('bg-audio'), playIcon=document.getElementById('play-icon'),
  vinyl=document.getElementById('vinyl-disk'), curT=document.getElementById('cur-time'),
  durT=document.getElementById('dur-time'), progress=document.getElementById('audio-progress'),
  eqBars=document.querySelectorAll('.eq-bar'), titleEl=document.getElementById('track-title'),
  coverEl=document.getElementById('cover');
let cur=0, isPlaying=false, userPaused=false;

function fmt(s){ s=Math.floor(s||0); const m=Math.floor(s/60), r=s%60; return (m<10?'0'+m:m)+':'+(r<10?'0'+r:r); }
function loadTrack(i, autoplay){
  cur=(i+tracks.length)%tracks.length; const t=tracks[cur];
  audio.src=t.src; titleEl.textContent=t.title; if(t.cover) coverEl.src=t.cover;
  progress.value=0; curT.textContent='00:00'; durT.textContent='00:00';
  if(autoplay) audio.play().then(()=>setPlayState(true)).catch(()=>setPlayState(false));
}
function nextTrack(){ userPaused=false; loadTrack(cur+1,true); }
function prevTrack(){ userPaused=false; if(audio.currentTime>3){audio.currentTime=0;return;} loadTrack(cur-1,true); }
function toggleAudio(){
  if(isPlaying){ userPaused=true; audio.pause(); setPlayState(false); }
  else { userPaused=false; audio.play().then(()=>setPlayState(true)).catch(()=>{}); }
}
function setPlayState(p){
  isPlaying=p; vinyl.classList.toggle('animate-spin-slow',p);
  playIcon.innerHTML=p?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  eqBars.forEach(b=>{ b.classList.toggle('active',p); b.classList.toggle('bg-zinc-400',!p); b.classList.toggle('bg-pink-400',p); });
}
function seekAudio(v){ audio.currentTime=v; }
audio.addEventListener('timeupdate',()=>{ progress.value=Math.floor(audio.currentTime); curT.textContent=fmt(audio.currentTime); });
audio.addEventListener('loadedmetadata',()=>{ if(audio.duration&&!isNaN(audio.duration)){ progress.max=Math.floor(audio.duration); durT.textContent=fmt(audio.duration);} });
audio.addEventListener('ended',()=>{ if(tracks.length>1) nextTrack(); else { audio.currentTime=0; audio.play(); } });
loadTrack(0,false);

function enterSite(){
  const o=document.getElementById('click-overlay');
  if(o){ o.style.opacity='0'; setTimeout(()=>o.style.display='none',700); }
  if(!userPaused && !isPlaying) audio.play().then(()=>setPlayState(true)).catch(()=>{});
}
/* любой первый тап запускает музыку (кроме кнопок плеера) */
function onScreen(e){ if(userPaused) return; const t=e.target; if(t&&t.closest&&t.closest('[data-audio-control="true"]')) return; enterSite(); }
window.addEventListener('pointerdown',onScreen);

/* Discord через Lanyard */
function updateDiscordUI(d){
  if(!d) return; const u=d.discord_user, st=d.discord_status||'offline';
  document.getElementById('discord-widget').style.display='flex';
  const mdot=document.getElementById('main-status-dot'); mdot.style.display='block';
  if(u){
    if(u.avatar){ const url='https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.'+(u.avatar.startsWith('a_')?'gif':'webp')+'?size=256';
      for(const id of ['discord-avatar','main-avatar']){ const im=document.getElementById(id); im.onerror=()=>{im.onerror=null;im.src='avatar.jpg'}; im.src=url; } }
    document.getElementById('discord-name').textContent=u.global_name||u.username;
  }
  const dot=document.getElementById('discord-status-dot');
  const col={online:'bg-emerald-500',idle:'bg-amber-400',dnd:'bg-rose-500'}[st]||'bg-zinc-400';
  dot.className='absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full ring-2 ring-white '+col;
  mdot.className='absolute right-0.5 bottom-0.5 z-20 w-5 h-5 rounded-full ring-[3px] ring-white '+col;
  let a='',b='',badge='';
  if(d.listening_to_spotify&&d.spotify){ a='Listening to '+d.spotify.song; b='by '+d.spotify.artist; badge='SPOTIFY'; }
  else {
    const acts=d.activities||[], game=acts.find(x=>x.type!==4), custom=acts.find(x=>x.type===4);
    if(game){ a='Playing '+game.name; b=game.details||game.state||''; badge=(game.name||'GAME').toUpperCase().slice(0,12); }
    else if(custom){ a=custom.state||custom.name||''; badge='STATUS'; }
    else { a={online:'Online on Discord',idle:'Away / Idle',dnd:'Do Not Disturb'}[st]||'Offline'; }
  }
  document.getElementById('discord-activity-title').textContent=a;
  document.getElementById('discord-activity-details').textContent=b;
  const be=document.getElementById('discord-badge'); be.style.display=badge?'block':'none'; be.querySelector('span').textContent=badge;
}
if(/^\d{17,20}$/.test(lanyardUserId)){
  fetch('https://api.lanyard.rest/v1/users/'+lanyardUserId).then(r=>r.json()).then(j=>{ if(j&&j.success&&j.data) updateDiscordUI(j.data); }).catch(()=>{});
  try{
    const ws=new WebSocket('wss://api.lanyard.rest/socket'); let hb=null;
    ws.onopen=()=>ws.send(JSON.stringify({op:2,d:{subscribe_to_id:lanyardUserId}}));
    ws.onmessage=ev=>{ try{ const m=JSON.parse(ev.data);
      if(m.op===1&&m.d&&m.d.heartbeat_interval){ clearInterval(hb); hb=setInterval(()=>{ if(ws.readyState===1) ws.send(JSON.stringify({op:3})); },m.d.heartbeat_interval); }
      if(m.op===0&&(m.t==='INIT_STATE'||m.t==='PRESENCE_UPDATE')) updateDiscordUI(m.d);
    }catch(e){} };
    ws.onclose=()=>clearInterval(hb);
  }catch(e){}
}

/* частицы / снег */
const canvas=document.getElementById('snow-canvas');
if(canvas){
  const ctx=canvas.getContext('2d'); let w=canvas.width=innerWidth, h=canvas.height=innerHeight;
  addEventListener('resize',()=>{ w=canvas.width=innerWidth; h=canvas.height=innerHeight; });
  const shapes=['dot','cross','streak'];
  const ps=Array.from({length:60},()=>({x:Math.random()*w,y:Math.random()*h,shape:shapes[Math.floor(Math.random()*3)],size:Math.random()*2.5+1,sx:(Math.random()-.5)*.4,sy:(Math.random()-.5)*.35,op:Math.random()*.6+.25,tw:Math.random()*.04+.01,a:Math.random()*Math.PI*2}));
  (function draw(){
    ctx.clearRect(0,0,w,h);
    for(const p of ps){
      p.a+=p.tw; p.x+=p.sx; p.y+=p.sy;
      const o=Math.max(.1,Math.min(1,p.op+Math.sin(p.a)*.35));
      ctx.save(); ctx.fillStyle=ctx.strokeStyle='rgba(255,255,255,'+o+')'; ctx.shadowBlur=6; ctx.shadowColor='rgba(255,255,255,.7)';
      ctx.beginPath();
      if(p.shape==='cross'){ const r=p.size*1.6; ctx.moveTo(p.x-r,p.y); ctx.lineTo(p.x+r,p.y); ctx.moveTo(p.x,p.y-r); ctx.lineTo(p.x,p.y+r); ctx.lineWidth=1; ctx.stroke(); }
      else if(p.shape==='streak'){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.size*2,p.y+p.size*.8); ctx.lineWidth=.8; ctx.stroke(); }
      else { ctx.arc(p.x,p.y,p.size*.75,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
      if(p.y>h+10){p.y=-10;p.x=Math.random()*w} else if(p.y<-10){p.y=h+10;p.x=Math.random()*w}
      if(p.x>w+10){p.x=-10;p.y=Math.random()*h} else if(p.x<-10){p.x=w+10;p.y=Math.random()*h}
    }
    requestAnimationFrame(draw);
  })();
}
</script>
